<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Observatório Brasil 2026 — Eleições 2022–2026</title><meta name="theme-color" content="#0b3027">
<style>html,body{margin:0;background:#09251e;color:#f2f1e5;font-family:system-ui,sans-serif;min-height:100%}.shell{max-width:780px;margin:12vh auto;padding:28px}.tag{letter-spacing:.13em;color:#facb57;font-size:12px;font-weight:bold}.card{padding:36px;border:1px solid #315946;border-radius:22px;background:linear-gradient(125deg,#123e2f,#0a2c24)}h1{font-size:clamp(28px,6vw,50px);margin:20px 0}p{line-height:1.6;color:#b7d5c6}progress{accent-color:#f4c84e;width:100%;height:12px}.links{margin-top:20px}a{color:#facb57}</style>
</head><body><main class="shell"><section class="card"><div class="tag">OBSERVATÓRIO BRASIL · 2022–2026</div>
<h1>Carregando estudo eleitoral...</h1><p id="status">Preparando dados e visualizações.</p>
<progress id="bar" value="0" max="18"></progress>
<p class="links">Os arquivos deste estudo são públicos e auditáveis no <a href="https://github.com/pedromaintenance/analise-tse-22e26">repositório</a>.</p></section></main>
<script>
(async function(){
  const n=18, root='./payload/', status=document.getElementById('status'),bar=document.getElementById('bar');
  try{
    const chunks=Array(n);
    let done=0;
    await Promise.all(Array.from({length:n},async(_,i)=>{
      const name='part-'+String(i).padStart(2,'0')+'.txt';
      const r=await fetch(root+name,{cache:'force-cache'});
      if(!r.ok)throw new Error('HTTP '+r.status+' ao ler '+name);
      chunks[i]=await r.text();
      bar.value=++done;status.textContent='Carregando módulos: '+done+' de '+n;
    }));
    const original=chunks.join('');
    if(!original.startsWith('<!doctype html>')||!original.endsWith('</body></html>'))throw new Error('Pacote incompleto.');

    const mobileStyles="<style id=\"mobile-chart-fix\">\n@media(max-width:767px){\nhtml,body{max-width:100%!important;overflow-x:hidden!important}\n.grid-2:has(#ufGainChart){display:grid!important;grid-template-columns:minmax(0,1fr)!important;width:100%!important;min-width:0!important}\n.grid-2:has(#ufGainChart)>div,.grid-2:has(#ufGainChart)>aside{width:100%!important;max-width:100%!important;min-width:0!important}\n#ufGainChart{max-width:100%!important;min-width:0!important;width:100%!important}\n#ufGainChart .svg-container{max-width:100%!important}\n#focusBox{border-left:0!important;border-top:1px solid #456b5c!important;border-radius:0!important}\n#focusBox .panel-body{padding:14px!important}\n#focusBox .big{font-size:clamp(32px,9vw,54px)!important}\n.js-plotly-plot,.js-plotly-plot .plot-container,.js-plotly-plot .svg-container{touch-action:pan-y!important}\n.js-plotly-plot .draglayer,.js-plotly-plot .zoomlayer,.js-plotly-plot .nsewdrag,.js-plotly-plot .modebar,.js-plotly-plot .hoverlayer{pointer-events:none!important}\n}\n</style>";
    const editorialRevisions=[["O voto brasileiro em quatro eleições.","Observatório Brasil 2026: dados, séries e visualização."],["Uma leitura interativa da mudança de base, da ordem de totalização das seções, do deslocamento estadual entre os turnos e da participação eleitoral. Dados de 100% das seções de 2026, com bases comparáveis explicitadas.","Desenvolvi este painel para organizar e explorar dados públicos de quatro eleições presidenciais. Aqui comparo séries históricas, resultados estaduais e indicadores de participação, deixando explícitos os critérios que tornam cada comparação possível."],["Na base restrita aos dois finalistas, Lula passou de 48,99% para 51,79%. Os votos dos demais candidatos são retirados apenas do denominador dessa comparação.","Nesta comparação, normalizei os resultados entre os dois finalistas: 48,99% no primeiro turno e 51,79% no segundo. A normalização altera o denominador, não os votos registrados."],["A participação final de Lula foi superior ao 2º turno de 2022, mas inferior aos 52,86% que obteve no 1º turno de 2022 quando isolamos somente Lula e Jair.","Separei os dois tipos de comparação para não confundir percentuais oficiais com uma base normalizada entre finalistas. Os indicadores só fazem sentido quando mantemos o mesmo denominador."],["De 46% a 100% das seções, o conjunto de votos ainda não registrado na última captura favoreceu Lula. É um agregado longo, não uma sequência contínua de lotes observados.","Neste intervalo, posso medir a diferença entre registros acumulados, mas não reconstruir cada lote intermediário. Prefiro explicitar essa limitação a apresentar uma série artificialmente contínua."],["01 / A anatomia da apuração","01 / Como modelei a evolução da apuração"],["Como a participação acumulada mudou conforme as seções entraram; eixo X representa seções totalizadas, não horário nem tamanho uniforme dos lotes.","Usei a proporção de seções totalizadas como eixo de comparação. Ela permite observar a evolução acumulada, mas não corresponde ao tempo decorrido nem significa que os lotes tenham tamanho uniforme."],["Curvas de votação · base dos dois finalistas","Séries acumuladas · base dos dois finalistas"],["A curva do 2º turno entre 46% e 92,7% agora usa parciais históricas publicadas pelo UOL (arredondadas a 0,1 p.p.) e arquivos EA20 com votos exatos preservados por um projeto de arquivamento independente.","Para reconstruir o trecho de 46% a 92,7% do segundo turno, integrei registros históricos do UOL, com percentuais arredondados, e snapshots EA20 preservados por um arquivo independente."],["Os pontos são observados; a linha apenas os conecta para visualização.","Cada ponto corresponde a um registro recuperado; as linhas servem apenas para facilitar a leitura entre observações."],["Onde a curva mudou de direção","Onde identifiquei mudanças na curva"],["Voto incremental: somente os votos novos entre os registros","Votos incrementais entre registros observados"],["02 / Quatro pleitos, uma base comparável","02 / Como comparei quatro pleitos"],["Alternar o denominador muda as conclusões. O primeiro turno permite duas leituras diferentes, ambas corretas se claramente identificadas.","Mantive duas bases de comparação: todos os votos válidos e apenas os votos dos dois principais candidatos. Elas respondem a perguntas diferentes, sobretudo no primeiro turno."],["Participação de Lula nos resultados finais","Participação nos resultados finais"],["A base restrita mostra mudança relativa entre Lula e Flávio. O aumento em votos absolutos também depende de comparecimento e votos anteriormente dados a terceiros.","A base restrita aos finalistas ajuda a comparar participações relativas. Também apresento contagens absolutas, porque proporções e volumes de votos não medem exatamente a mesma coisa."],["Comparação entre disputas de dois candidatos: a parcela dos votos válidos de Lula aumentou, mas os adversários e as condições políticas diferem.","A comparação entre segundos turnos usa disputas de dois candidatos, mas mantenho identificados os anos e os adversários para não tratar contextos distintos como equivalentes."],["Ao excluir votos em terceiros no 1º turno de 2022, a participação relativa de Lula naquela eleição é maior que a parcela final de 2026.","A normalização do primeiro turno de 2022 exclui os votos dos demais candidatos apenas do denominador analítico; por isso não pode ser lida como a participação oficial no pleito."],["03 / 27 estados: onde a base mudou?","03 / Como organizei os resultados por UF"],["Primeiro e segundo turnos de 2026, com votos estaduais finais e 100% das seções totalizadas. Selecione uma UF para aprofundar a leitura.","Reuni os resultados finais das 27 UFs e organizei comparações entre os turnos. Selecione uma unidade da federação para examinar seus indicadores e totais."],["Variação da participação de Lula por UF","Variação de participação por UF"],["Base estadual completa · comparação auditável","Base estadual · dados e comparações"],["Contribuição territorial à margem final","Composição territorial da margem final"],["Os saldos regionais podem se anular. O resultado nacional também inclui votos do exterior, tratados separadamente da soma das 27 UFs.","Calculei os saldos regionais a partir das UFs e mantive o exterior separado. Essa distinção é necessária para conciliar a soma territorial com o resultado nacional."],["04 / Comparecimento, abstenção e votos inválidos","04 / Indicadores de participação eleitoral"],["Abstenção = eleitorado que não compareceu / eleitorado apto. Nulos e brancos = votos da categoria / comparecimento. Os denominadores são diferentes.","Calculei abstenção sobre o eleitorado apto e brancos e nulos sobre o comparecimento. São indicadores diferentes, com denominadores que precisam permanecer identificados."],["05 / Metodologia e rastreabilidade","05 / Como tratei os dados"],["Valores reais, bases distintas e limitações da série tratados explicitamente.","Documentei fontes, regras de cálculo, diferenças entre bases e lacunas nas séries para tornar a análise verificável."],["O que exatamente estamos medindo","Definições que usei nos indicadores"],["Base de dois candidatos: votos de Lula ÷ (votos Lula + votos do outro finalista).","Base de dois candidatos: calculei votos de Lula ÷ (votos Lula + votos do outro finalista)."],["Votos incrementais: diferença dos votos acumulados entre duas capturas.","Votos incrementais: calculei a diferença dos votos acumulados entre duas capturas."],["Fontes e auditoria","Fontes que consultei"],["O painel é um arquivo HTML independente: gráficos, dados e biblioteca interativa estão incluídos localmente. A abertura de links externos exige internet; a exploração dos resultados não.","Preparei o painel para funcionar também como um HTML independente, com gráficos, biblioteca e dados incorporados. A exploração offline não exige conexão; apenas os links das referências externas precisam de internet."]];
    let editedHTML=original;
    for(const [before,after] of editorialRevisions){editedHTML=editedHTML.split(before).join(after);}
    const touchLockStyles="<style id=\"mobile-plotly-touch-lock\">\n@media (max-width:767px) and (pointer:coarse){\n.js-plotly-plot,\n.js-plotly-plot .plot-container,\n.js-plotly-plot .svg-container,\n.js-plotly-plot .main-svg,\n.js-plotly-plot .gl-container,\n.js-plotly-plot canvas,\n.js-plotly-plot svg,\n.js-plotly-plot .modebar,\n.js-plotly-plot .draglayer,\n.js-plotly-plot .hoverlayer {\n pointer-events:none!important;\n touch-action:pan-y!important;\n}\n}\n</style>";
    const responsiveHTML=editedHTML.replace('</head>',mobileStyles+touchLockStyles+'</head>');
    const url=URL.createObjectURL(new Blob([responsiveHTML],{type:'text/html;charset=utf-8'}));
    const tag='<a download="Observatorio_Brasil_2026_Standalone.html" href="'+url+'" title="Baixar o HTML completo para abrir sem internet" style="position:fixed;z-index:2147483640;bottom:13px;right:13px;background:#f5c84c;color:#153a2b;border:1px solid #153a2b;border-radius:9px;padding:10px 14px;box-shadow:0 6px 20px #0007;font:700 12px system-ui;text-decoration:none">↓ Baixar versão offline</a>';
    const output=responsiveHTML.replace(/<\/body>\s*<\/html>\s*$/i,tag+'</body></html>');
    document.open();document.write(output);document.close();
  }catch(error){status.textContent='Erro ao carregar: '+String(error.message)+' — confira a ativação do GitHub Pages e o acesso aos arquivos do repositório.';console.error(error)}
})();
</script></body></html>
